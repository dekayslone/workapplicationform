<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join the team — Application Form</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --emerald-900: #064e3b;
    --emerald-800: #065f46;
      --emerald-700: #047857;
    --emerald-50: #ecfdf5;
      --mint-100: #d1fae5;
      --amber-50: #fffbeb;
      --amber-600: #b45309;
    --stone-900: #1c1917;
    --stone-700: #44403c;
    --stone-600: #57534e;
    --stone-500: #78716c;
    --stone-400: #a8a29e;
    --stone-300: #d6d3d1;
    --stone-200: #e7e5e4;
    --stone-100: #f5f5f4;
    --red-600: #dc2626;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
      background:
        radial-gradient(circle at 8% 0%, rgba(167, 243, 208, .34), transparent 26rem),
        linear-gradient(135deg, #f8faf8 0%, var(--stone-100) 52%, #f3f5f2 100%);
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--stone-900);
      padding: 56px 16px;
      min-height: 100vh;
  }

  .wrap { max-width: 620px; margin: 0 auto; }

  @media (max-width: 640px) {
    body { padding: 0; }
    .wrap { max-width: 100%; }
    .card { border-radius: 0; border-left: none; border-right: none; min-height: 100vh; }
    .card-header { padding: 22px 20px; }
    .card-header h1 { font-size: 22px; }
    .card-body { padding: 22px 18px 32px; }
    .admin-toggle-wrap { padding: 16px 0; }
  }

  .card {
    background: #fff;
      border-radius: 16px;
      border: 1px solid rgba(214, 211, 209, .85);
      box-shadow: 0 22px 60px rgba(28, 25, 23, .08), 0 2px 8px rgba(28, 25, 23, .04);
    overflow: hidden;
  }

  .card-header {
    background: var(--emerald-900);
      padding: 30px 32px 32px;
      position: relative;
    }
    .card-header::after {
      content: "";
      position: absolute;
      right: 28px;
      bottom: 24px;
      width: 74px;
      height: 74px;
      border: 1px solid rgba(209, 250, 229, .25);
      border-radius: 50%;
      box-shadow: 0 0 0 12px rgba(209, 250, 229, .06), 0 0 0 24px rgba(209, 250, 229, .04);
  }
  .card-header .eyebrow {
    color: #a7f3d0;
    font-size: 12px;
    letter-spacing: 0.02em;
    margin: 0 0 4px;
  }
  .card-header h1 {
    color: #fff;
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .card-body { padding: 34px 32px 32px; }

  h2.section-title {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 500;
    margin: 0 0 6px;
    color: var(--stone-900);
  }

  .section-title::after {
    content: "";
    display: block;
    width: 30px;
    height: 3px;
    background: var(--mint-100);
    border-radius: 4px;
    margin-top: 10px;
  }

  .hint { color: var(--stone-500); font-size: 14px; margin: 0 0 14px; }

  label.field-label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--stone-700);
    margin-bottom: 6px;
  }

  input[type="text"], input[type="email"], input[type="tel"], input[type="password"], textarea {
    width: 100%;
    border: 1px solid var(--stone-300);
    border-radius: 8px;
    padding: 13px 14px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px;
    color: var(--stone-900);
    background: #fff;
    background: #fdfdfc;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  @media (max-width: 640px) {
    input, textarea { font-size: 16px; } /* prevents iOS auto-zoom on focus */
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--emerald-800);
    box-shadow: 0 0 0 2px rgba(6,95,70,0.18);
      background: #fff;
  }
    .field { margin-bottom: 24px; }
  textarea { resize: vertical; min-height: 44px; }

  .field { margin-bottom: 20px; }

  .gender-options { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    padding: 10px 15px;
    border-radius: 999px;
    border: 1px solid var(--stone-300);
    background: #fff;
    color: var(--stone-600);
    font-size: 14px;
    cursor: pointer;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s, transform .15s;
  }
    .chip:hover { border-color: var(--emerald-700); transform: translateY(-1px); }
  .chip.selected {
    border-color: var(--emerald-800);
    background: var(--emerald-50);
    color: var(--emerald-900);
  }

  .skills-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 16px;
    margin-top: 8px;
  }
  .skills-grid.single { grid-template-columns: 1fr; }
  @media (max-width: 640px) {
    .skills-grid { grid-template-columns: 1fr; }
  }
  .skill-check {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    color: var(--stone-700);
    padding: 7px 0;
    cursor: pointer;
  }
  .skill-check input { accent-color: var(--emerald-800); margin-top: 3px; width: 18px; height: 18px; flex-shrink: 0; }

  .unit-option {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--stone-300);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color .15s, background .15s, box-shadow .15s, transform .15s;
  }
  .unit-option:hover { border-color: var(--emerald-700); transform: translateX(2px); }
  .unit-option.selected { border-color: var(--emerald-800); background: var(--emerald-50); }
  .unit-option input { accent-color: var(--emerald-800); }
  .unit-option span { font-size: 14px; color: var(--stone-900); }

  .progress { display: flex; align-items: center; gap: 8px; margin-bottom: 34px; }
  .progress-step { display: flex; align-items: center; gap: 6px; }
  .progress-num {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 500;
    background: var(--stone-100); color: var(--stone-500);
    border: 1px solid var(--stone-200);
  }
  .progress-num.active { background: var(--emerald-800); color: #fff; }
  .progress-label { font-size: 12px; color: var(--stone-400); }
  .progress-label.active { color: var(--stone-900); font-weight: 500; }
  .progress-line { flex: 1; height: 1px; background: var(--stone-200); }
  @media (max-width: 520px) { .progress-label { display: none; } }

  .q-block { margin-bottom: 16px; }

  .divider { border-top: 1px solid var(--stone-200); padding-top: 16px; margin-top: 16px; }

  .btn {
    border: none;
    border-radius: 8px;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s, opacity .15s;
    font-family: 'IBM Plex Sans', sans-serif;
    transition: background .15s, opacity .15s, transform .15s, box-shadow .15s;
  }
  .btn-primary {
    background: var(--emerald-800);
    color: #fff;
    padding: 12px 24px;
      padding: 13px 24px;
      box-shadow: 0 5px 12px rgba(6, 95, 70, .14);
  }
    .btn-primary:hover { background: var(--emerald-900); transform: translateY(-1px); box-shadow: 0 7px 16px rgba(6, 95, 70, .2); }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .btn-primary.full { width: 100%; padding: 13px; }
  .btn-ghost {
    background: none;
    color: var(--stone-500);
    padding: 10px 16px;
  }
  .btn-ghost:hover { color: var(--stone-700); }

  .row-between { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; gap: 12px; }
  @media (max-width: 640px) {
    .row-between { position: sticky; bottom: 0; background: #fff; margin: 24px -18px -32px; padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--stone-200); }
    .btn-primary { flex: 1; padding: 13px; }
  }

  .error-text { color: var(--red-600); font-size: 14px; margin: 14px 0 0; }

  .intro-list { color: var(--stone-600); font-size: 14px; margin: 0 0 28px; padding-left: 0; list-style: none; }
  .intro-list li { margin-bottom: 9px; padding-left: 25px; position: relative; }
  .intro-list li::before { content: ""; position: absolute; left: 0; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--mint-100); box-shadow: inset 0 0 0 2px var(--emerald-700); }

  .intro-kicker { color: var(--emerald-800); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 10px; }
  .intro-title { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 500; line-height: 1.2; margin: 0 0 10px; }
  .intro-copy { color: var(--stone-600); line-height: 1.65; margin: 0 0 22px; }
  .intro-note { display: inline-flex; align-items: center; gap: 7px; color: var(--amber-600); background: var(--amber-50); border-radius: 999px; padding: 7px 11px; font-size: 12px; margin-bottom: 24px; }

  .review-row { font-size: 14px; color: var(--stone-700); margin-bottom: 10px; }
  .review-row .label { color: var(--stone-500); }

  .success-wrap { text-align: center; padding: 12px 0; }
  .success-check {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--emerald-50); color: var(--emerald-800);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px; font-size: 22px;
  }
  .ref-code { color: var(--stone-400); font-size: 12px; margin-bottom: 24px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div class="card-header">
      <p class="eyebrow">New member application</p>
      <h1>Join the team</h1>
    </div>
    <div class="card-body" id="cardBody"></div>
  </div>

</div>

<script>
const CORE_SKILLS = [
  "Communication", "Relationship Building", "Teamwork", "Leadership",
  "Problem-Solving", "Strategic Thinking", "Community Management",
  "Partnership Management", "Networking", "Marketing", "Branding",
  "Content Creation", "Social Media Management", "Event Planning",
  "Research", "Negotiation", "Conflict Resolution", "Creativity",
  "Project Management", "Data Analysis", "Time Management",
  "Organization", "Customer/Member Engagement", "Feedback Management",
  "Adaptability",
];

const UNITS = [
  { id: "partner", label: "Partner Management" },
  { id: "tribe", label: "Tribe Experience" },
  { id: "brand", label: "Brand Strategy Planning (Communication & Marketing)" },
];

const UNIT_DETAIL = {
  partner: {
    title: "Partner Management",
    skills: [
      "Relationship management", "Communication and interpersonal skills",
      "Negotiation", "Problem-solving", "Conflict resolution",
      "Partnership development", "Networking", "Follow-up and accountability",
      "Organization and documentation", "Strategic thinking", "CRM/data management",
    ],
    questions: [
      "What does effective partner management mean to you?",
      "How would you build and maintain a strong relationship with a partner?",
      "How would you handle a partner who is becoming unresponsive?",
      "Tell us about a time you had to manage a difficult relationship or stakeholder.",
      "How would you approach a potential partner for the first time?",
      "Two partners have conflicting expectations. How would you resolve the situation?",
      "How do you ensure that partnership commitments are followed through?",
      "What metrics would you use to determine whether a partnership is successful?",
      "How would you identify potential partners that align with an organization?",
      "Why do you think you would be good at managing partnerships?",
    ],
    scenario: "You have been assigned to secure 5 strategic partners for an upcoming project within 30 days. Walk us through your approach from identifying prospects to closing and maintaining the partnerships.",
  },
  tribe: {
    title: "Tribe Experience",
    skills: [
      "Community management", "Member engagement", "Communication", "Empathy",
      "Community building", "Conflict resolution", "Feedback collection",
      "Problem-solving", "Creativity", "Content/community activation",
      "Data and feedback analysis", "Team collaboration", "Customer/member experience",
    ],
    questions: [
      "What does a great tribe/community experience look like to you?",
      "How would you make new members feel welcomed and included?",
      "What strategies would you use to keep members actively engaged?",
      "How would you handle a member who feels ignored or disconnected from the community?",
      "If engagement within the tribe suddenly dropped, what would you do?",
      "How would you collect and use feedback from community members?",
      "Describe an idea you would implement to make a community more exciting.",
      "How would you handle conflict between two members of a community?",
      "What would you do if members consistently failed to participate in activities?",
      "How would you measure the success of a tribe/community experience?",
    ],
    scenario: "Our community has 500 members, but only 15% actively participate. What would you do in your first 30 days to improve engagement?",
  },
  brand: {
    title: "Brand Strategy Planning — Communication & Marketing",
    skills: [
      "Brand positioning", "Strategic planning", "Market research", "Audience research",
      "Marketing strategy", "Communication strategy", "Content strategy",
      "Campaign/Project planning", "Copywriting", "Social media strategy",
      "Competitor analysis", "Creative thinking", "Data/analytics interpretation",
      "Storytelling", "Brand consistency",
    ],
    questions: [
      "What is the difference between a brand strategy and a marketing strategy?",
      "How would you develop a communication strategy for a new brand?",
      "How would you identify and define a brand's target audience?",
      "What factors would you consider when positioning a brand?",
      "How would you ensure that a brand's communication remains consistent across different platforms?",
      "A brand has good products but very low awareness. What would your strategy be?",
      "How would you research competitors before developing a brand strategy?",
      "What metrics would you use to determine whether a marketing campaign is successful?",
      "Give an example of how you would turn a brand's mission into a communication campaign.",
      "If you had a limited marketing budget, how would you prioritize your marketing activities?",
      "How would you respond if a campaign you planned performed poorly?",
      "What brands do you think have excellent communication, and why?",
    ],
    scenario: "You are given a new brand with a great product but no clear positioning, communication style, or marketing strategy. Take us through how you would build its brand strategy from scratch.",
  },
};

const STEPS = ["Your details", "Choose a unit", "Unit questions", "Review"];
const WHATSAPP_GROUP_LINK = "https://chat.whatsapp.com/LtdVRfpwtQdLnCujVyvOZq?s=cl&p=i&mlu=4&ilr=4";

let state = {
  stage: "intro", // intro | form | review | success | admin
  stepIndex: 0,
  error: "",
  submitting: false,
  refCode: "",
  data: {
    name: "", email: "", whatsapp: "", gender: "",
    skills: [], unit: "", unitSkills: [], answers: {}, scenario: "",
  },
};

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function esc(s) {
  const d = document.createElement("div");
  d.innerText = s == null ? "" : s;
  return d.innerHTML;
}
function unitLabel(id) {
  const u = UNITS.find((x) => x.id === id);
  return u ? u.label : "";
}

function validateStep0() {
  if (!state.data.name.trim()) return "Please enter your name.";
  if (!state.data.email.trim() || !state.data.email.includes("@")) return "Please enter a valid email.";
  if (!state.data.whatsapp.trim()) return "Please enter your WhatsApp number.";
  if (!state.data.gender) return "Please select your gender.";
  return "";
}
function validateStep1() {
  if (!state.data.unit) return "Please choose a unit.";
  return "";
}

function goNext() {
  state.error = "";
  if (state.stepIndex === 0) {
    const e = validateStep0();
    if (e) { state.error = e; render(); return; }
  }
  if (state.stepIndex === 1) {
    const e = validateStep1();
    if (e) { state.error = e; render(); return; }
  }
  if (state.stepIndex < STEPS.length - 1) {
    state.stepIndex++;
  } else {
    state.stage = "review";
  }
  render();
}
function goBack() {
  state.error = "";
  if (state.stepIndex === 0) { state.stage = "intro"; render(); return; }
  state.stepIndex--;
  render();
}
function selectUnit(id) {
  state.data.unit = id;
  state.data.unitSkills = [];
  state.data.answers = {};
  state.data.scenario = "";
  render();
}
function toggleSkill(skill, field) {
  const arr = state.data[field];
  const i = arr.indexOf(skill);
  if (i === -1) arr.push(skill); else arr.splice(i, 1);
  render();
}

async function handleSubmit() {
  state.submitting = true;
  state.error = "";
  render();
  const id = genId();
  const payload = {
    _subject: `New member application from ${state.data.name}`,
    _cc: "kayslone.dara@gmail.com",
    _template: "table",
    _captcha: "false",
    reference: id.toUpperCase(),
    name: state.data.name,
    email: state.data.email,
    whatsapp: state.data.whatsapp,
    gender: state.data.gender,
    skills: state.data.skills.join(", ") || "None selected",
    unit: unitLabel(state.data.unit),
    unitSkills: state.data.unitSkills.join(", ") || "None selected",
    answers: Object.entries(state.data.answers).map(([question, answer]) => `${question}\n${answer}`).join("\n\n"),
    scenario: state.data.scenario,
  };
  try {
    const response = await fetch("https://formsubmit.co/ajax/phoebeomotola01@gmail.com", {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify(payload),
    });
    if (!response.ok) throw new Error("Email delivery failed");
    state.refCode = id.toUpperCase();
    state.stage = "success";
    render();
    setTimeout(() => { window.location.href = WHATSAPP_GROUP_LINK; }, 1200);
  } catch (err) {
    state.error = "Something went wrong sending your application. Please try submitting again.";
  } finally {
    state.submitting = false;
    render();
  }
}

function startOver() {
  state = {
    stage: "intro", stepIndex: 0, error: "", submitting: false, refCode: "",
    data: { name: "", email: "", whatsapp: "", gender: "", skills: [], unit: "", unitSkills: [], answers: {}, scenario: "" },
  };
  render();
}

function skillsGridHTML(list, field, single) {
  return `<div class="skills-grid ${single ? "single" : ""}">` +
    list.map((skill) => {
      const checked = state.data[field].includes(skill) ? "checked" : "";
      return `<label class="skill-check">
        <input type="checkbox" data-skill="${esc(skill)}" data-field="${field}" ${checked} />
        <span>${esc(skill)}</span>
      </label>`;
    }).join("") + `</div>`;
}

function progressHTML() {
  return `<div class="progress">` + STEPS.map((s, i) => {
    const active = i <= state.stepIndex;
    const line = i < STEPS.length - 1 ? `<div class="progress-line"></div>` : "";
    return `<div class="progress-step">
        <div class="progress-num ${active ? "active" : ""}">${i + 1}</div>
        <span class="progress-label ${i === state.stepIndex ? "active" : ""}">${esc(s)}</span>
      </div>${line}`;
  }).join("") + `</div>`;
}

function render() {
  const body = document.getElementById("cardBody");

  if (state.stage === "intro") {
    body.innerHTML = `
      <p class="intro-kicker">Your next chapter starts here</p>
      <h2 class="intro-title">Bring your strengths to a team that is building what matters.</h2>
      <p class="intro-copy">
        Share a few details about yourself, the skills you bring, and the unit you'd like to join.
        We'll then ask a few practical questions before you submit.
      </p>
      <div class="intro-note"><span aria-hidden="true">◷</span> Takes about 10–15 minutes</div>
      <ul class="intro-list">
        <li>Your details and general skills</li>
        <li>The unit you want to join</li>
        <li>Unit-specific skills and questions</li>
        <li>A final review before you submit</li>
      </ul>
      <button class="btn btn-primary full" id="startBtn">Start application</button>
    `;
    document.getElementById("startBtn").onclick = () => { state.stage = "form"; render(); };
    return;
  }

  if (state.stage === "form") {
    let stepHTML = "";

    if (state.stepIndex === 0) {
      stepHTML = `
        <h2 class="section-title">Section 1 — Your details</h2>
        <div style="height:12px"></div>
        <div class="field">
          <label class="field-label" for="f-name">What is your name?</label>
          <input type="text" id="f-name" placeholder="Full name" value="${esc(state.data.name)}" />
        </div>
        <div class="field">
          <label class="field-label" for="f-email">Email</label>
          <input type="email" id="f-email" placeholder="you@example.com" value="${esc(state.data.email)}" />
        </div>
        <div class="field">
          <label class="field-label" for="f-whatsapp">WhatsApp phone number</label>
          <input type="tel" id="f-whatsapp" placeholder="+234 800 000 0000" value="${esc(state.data.whatsapp)}" />
        </div>
        <div class="field">
          <label class="field-label">Gender</label>
          <div class="gender-options">
            ${["Male", "Female", "Prefer not to say"].map((g) =>
              `<button type="button" class="chip ${state.data.gender === g ? "selected" : ""}" data-gender="${esc(g)}">${esc(g)}</button>`
            ).join("")}
          </div>
        </div>
        <div class="field">
          <label class="field-label">Tick the skills you possess</label>
          ${skillsGridHTML(CORE_SKILLS, "skills", false)}
        </div>
      `;
    } else if (state.stepIndex === 1) {
      stepHTML = `
        <h2 class="section-title">Section 2 — Choose a unit</h2>
        <p class="hint">Select one functional unit to join.</p>
        ${UNITS.map((u) => `
          <label class="unit-option ${state.data.unit === u.id ? "selected" : ""}">
            <input type="radio" name="unit" data-unit="${u.id}" ${state.data.unit === u.id ? "checked" : ""} />
            <span>${esc(u.label)}</span>
          </label>
        `).join("")}
      `;
    } else if (state.stepIndex === 2) {
      const detail = UNIT_DETAIL[state.data.unit];
      if (detail) {
        stepHTML = `
          <h2 class="section-title">Section 3 — ${esc(detail.title)}</h2>
          <div style="height:12px"></div>
          <div class="field">
            <label class="field-label">Tick the skills you possess</label>
            ${skillsGridHTML(detail.skills, "unitSkills", true)}
          </div>
          ${detail.questions.map((q, i) => `
            <div class="q-block">
              <label class="field-label" for="f-answer-${i}">${i + 1}. ${esc(q)}</label>
              <textarea id="f-answer-${i}" rows="2" data-answer="${esc(q)}">${esc(state.data.answers[q] || "")}</textarea>
            </div>
          `).join("")}
          <div class="divider">
            <label class="field-label" for="f-scenario">Scenario question</label>
            <p class="hint">${esc(detail.scenario)}</p>
            <textarea rows="4" id="f-scenario">${esc(state.data.scenario)}</textarea>
          </div>
        `;
      }
    }

    body.innerHTML = `
      ${progressHTML()}
      ${stepHTML}
      ${state.error ? `<p class="error-text">${esc(state.error)}</p>` : ""}
      <div class="row-between">
        <button class="btn btn-ghost" id="backBtn">Back</button>
        <button class="btn btn-primary" id="nextBtn">${state.stepIndex === STEPS.length - 1 ? "Review" : "Continue"}</button>
      </div>
    `;

    document.getElementById("backBtn").onclick = goBack;
    document.getElementById("nextBtn").onclick = goNext;

    if (state.stepIndex === 0) {
      document.getElementById("f-name").oninput = (e) => { state.data.name = e.target.value; };
      document.getElementById("f-email").oninput = (e) => { state.data.email = e.target.value; };
      document.getElementById("f-whatsapp").oninput = (e) => { state.data.whatsapp = e.target.value; };
      body.querySelectorAll("[data-gender]").forEach((btn) => {
        btn.onclick = () => { state.data.gender = btn.getAttribute("data-gender"); render(); };
      });
      body.querySelectorAll("[data-skill]").forEach((cb) => {
        cb.onchange = () => toggleSkill(cb.getAttribute("data-skill"), cb.getAttribute("data-field"));
      });
    } else if (state.stepIndex === 1) {
      body.querySelectorAll("[data-unit]").forEach((r) => {
        r.onchange = () => selectUnit(r.getAttribute("data-unit"));
      });
    } else if (state.stepIndex === 2) {
      body.querySelectorAll("[data-skill]").forEach((cb) => {
        cb.onchange = () => toggleSkill(cb.getAttribute("data-skill"), cb.getAttribute("data-field"));
      });
      body.querySelectorAll("[data-answer]").forEach((ta) => {
        ta.oninput = (e) => { state.data.answers[ta.getAttribute("data-answer")] = e.target.value; };
      });
      const scenarioEl = document.getElementById("f-scenario");
      if (scenarioEl) scenarioEl.oninput = (e) => { state.data.scenario = e.target.value; };
    }
    return;
  }

  if (state.stage === "review") {
    body.innerHTML = `
      <h2 class="section-title">Section 4 — Review your application</h2>
      <div style="height:16px"></div>
      <div class="review-row"><span class="label">Name:</span> ${esc(state.data.name)}</div>
      <div class="review-row"><span class="label">Email:</span> ${esc(state.data.email)}</div>
      <div class="review-row"><span class="label">WhatsApp:</span> ${esc(state.data.whatsapp)}</div>
      <div class="review-row"><span class="label">Gender:</span> ${esc(state.data.gender)}</div>
      <div class="review-row"><span class="label">Skills:</span> ${esc(state.data.skills.join(", ") || "None selected")}</div>
      <div class="review-row"><span class="label">Unit:</span> ${esc(unitLabel(state.data.unit))}</div>
      <div class="review-row"><span class="label">Unit skills:</span> ${esc(state.data.unitSkills.join(", ") || "None selected")}</div>
      <div class="review-row" style="color:var(--stone-500)">Answers and scenario response included.</div>
      ${state.error ? `<p class="error-text">${esc(state.error)}</p>` : ""}
      <div class="row-between">
        <button class="btn btn-ghost" id="editBtn">Edit</button>
        <button class="btn btn-primary" id="submitBtn" ${state.submitting ? "disabled" : ""}>${state.submitting ? "Submitting..." : "Submit application"}</button>
      </div>
    `;
    document.getElementById("editBtn").onclick = () => { state.stage = "form"; state.stepIndex = STEPS.length - 1; render(); };
    document.getElementById("submitBtn").onclick = handleSubmit;
    return;
  }

  if (state.stage === "success") {
    const firstName = state.data.name.split(" ")[0] || "there";
    body.innerHTML = `
      <div class="success-wrap">
        <div class="success-check">✓</div>
        <h2 class="section-title">Application submitted</h2>
        <p style="color:var(--stone-600);font-size:14px;margin:8px 0 2px;">Thank you, ${esc(firstName)}. Your application has been submitted by email.</p>
        <p class="ref-code">Reference: ${esc(state.refCode)}</p>
        <button class="btn btn-ghost" id="againBtn" style="color:var(--emerald-800);">Submit another application</button>
      </div>
    `;
    document.getElementById("againBtn").onclick = startOver;
    return;
  }

}

render();
</script>
</body>
</html>
